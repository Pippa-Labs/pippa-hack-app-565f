# London Companion: the app's contract. Pippa routes on each outcome's summary
# and example_phrases, and refuses any output field not declared here.

manifest_version: 1

persistence: none

# Public pseudonym shown as "by <name>". Never a real name or an email address.
app_author_name: "peppa-pig"

app:
  id: hack.app_565f
  name: London Companion
  version: 0.1.0
  # Never use the word "by" here: the badge is split on it.
  summary: >-
    London helper for Tube, bus and train fares, routes and leave times, live delays,
    walking weather and police help. Also covers next departures, bike docks
    and station lifts, and sends only the places you name to TfL, Open-Meteo,
    postcodes.io and data.police.uk.

agent_types:
  - personal

outcomes:
  # ── Live transport ───────────────────────────────────────────────────────
  - id: transport.live
    summary: Live Tube and rail line status and delays, next bus or train departures from a stop, free Santander bikes and docks, and whether a station is step-free with its lifts working
    example_phrases:
      - is the central line running
      - any tube delays right now
      - when is the next bus from
      - next departures at the station
      - are there santander bikes near
      - free bike docks near
      - is the lift working at
      - is the station step free
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          "status" for line status, delays or closures; "departures" for the
          next buses or trains from a stop or station; "bikes" for hire bikes
          or free docks; "step_free" for lifts, step-free access or station
          accessibility. Return an empty string if unsure.
      - name: place
        type: string
        required: false
        description: >-
          The station, bus stop or area the user named, as written. Return an
          empty string if the message does not name one; never assume the
          user's location.
      - name: line
        type: string
        required: false
        description: >-
          The Tube, Overground, Elizabeth line or DLR line named, such as
          "Central" or "Northern". Return an empty string if no line is named.
    output:
      - name: task
        type: string
        description: Which live question was answered.
      - name: headline
        type: string
        description: One sentence with the answer.
      - name: facts
        type: array
        item_type: string
        description: The departures, docks, line statuses or station facilities.
      - name: source
        type: string
        description: Where the live data comes from.
      - name: as_of
        type: string
        description: When the live data was read, as an ISO time.
      - name: place
        type: string
        required: false
        description: The station, stop or area the answer is about.

  # ── Outdoors ─────────────────────────────────────────────────────────────
  - id: outdoors.walk
    summary: Whether it is a good time for a walk in London, with rain, temperature, wind, air quality and sunset for the next few hours
    example_phrases:
      - is it a good time for a walk
      - will it rain in london
      - what is the weather like in
      - do i need an umbrella
      - how is the air quality in
      - what time is sunset in london
      - is it nice enough to walk in the park
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          "walk" if the user asks whether to go for a walk or be outside;
          "weather" for rain, temperature, wind, air quality or sunset. Return
          an empty string if unsure.
      - name: place
        type: string
        required: false
        description: >-
          The London area, park or postcode named, as written. Return an empty
          string if the message does not name one.
      - name: minutes
        type: integer
        required: false
        description: >-
          How long the walk will be in minutes, if the user said. Leave this
          out entirely if they did not.
      - name: hours
        type: integer
        required: false
        description: >-
          How many hours ahead the user asks about (1 to 24), if they said.
          Leave this out entirely if they did not.
    output:
      - name: task
        type: string
        description: Which outdoors question was answered.
      - name: headline
        type: string
        description: One sentence with the answer.
      - name: facts
        type: array
        item_type: string
        description: Rain, wind, temperature, air quality and daylight details.
      - name: source
        type: string
        description: Where the weather data comes from.
      - name: as_of
        type: string
        description: The forecast hour the answer starts from, as an ISO time.
      - name: verdict
        type: string
        required: false
        description: For a walk, "go", "go with care" or "wait".
      - name: temperature_c
        type: number
        required: false
        description: The temperature now, in Celsius.
