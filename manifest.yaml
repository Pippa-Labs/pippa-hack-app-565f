# Pocket Londoner: the app's contract. Pippa routes on each outcome's summary
# and example_phrases, and refuses any output field not declared here.

manifest_version: 1

persistence: none

# Public pseudonym shown as "by <name>". Never a real name or an email address.
app_author_name: "peppa-pig"

app:
  id: hack.app_565f
  name: Pocket Londoner
  version: 0.1.2
  # Never use the word "by" here: the badge is split on it.
  summary: >-
    London helper for Tube, bus and train fares, routes, live delays, walks,
    umbrella weather and police help. Also covers next departures, bike docks
    and station lifts, and sends only the places you name to TfL, Open-Meteo,
    postcodes.io and data.police.uk.

agent_types:
  - personal

outcomes:
  # ── Journeys ─────────────────────────────────────────────────────────────
  - id: journey.plan
    summary: Plan a route across London, work out when to set off to arrive on time, or find a late-night way back with night buses and the Night Tube, with weather and sunset for an evening out
    example_phrases:
      - how do i get from
      - when should i leave to get to
      - night bus from soho to
      - i need to be at the restaurant by
      - dinner reservation at
      - catch the sunset on the way to
      - and get home after
      - fastest way to get to
      - what time do i need to set off for
      - route with fewest changes to
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          "route" for a route between two places; "leave_by" when the user must
          be somewhere by a time (to set off on time, or plan an evening out
          with sunset and the way home); "night" for travel late at night
          (after about 23:00) or a night bus or the Night Tube. Return an empty
          string if unsure.
      - name: from_place
        type: string
        required: false
        description: >-
          Where the journey starts: a station, postcode, landmark or area, as
          the user wrote it. Return an empty string if the message does not
          name one; never assume the user's location.
      - name: to_place
        type: string
        required: false
        description: >-
          Where the journey ends or where the user needs to be: a station,
          postcode, landmark or area, as the user wrote it. Return an empty
          string if the message does not name one.
      - name: arrive_by
        type: string
        required: false
        description: >-
          The time the user must arrive, as 24-hour HH:MM London time; convert
          "by 6 for dinner" to 18:00. Return an empty string if no time is given.
      - name: depart_at
        type: string
        required: false
        description: >-
          The time the user wants to set off, as 24-hour HH:MM London time;
          convert "at 6 after work" to 18:00. Return an empty string if no time
          is given.
      - name: occasion
        type: string
        required: false
        description: >-
          What the user is going to, in a word or two, such as "dinner",
          "drinks", "theatre" or "work". Return an empty string if not mentioned.
      - name: tonight
        type: boolean
        required: false
        description: >-
          True if the user says tonight or this evening. Leave this out
          entirely if not mentioned; never guess.
      - name: return_to
        type: string
        required: false
        description: >-
          Where the user goes home or back to afterwards, as written. Return an
          empty string if not mentioned; never assume where they live.
      - name: return_time
        type: string
        required: false
        description: >-
          When the user heads back, as 24-hour HH:MM London time. Return an
          empty string if not mentioned.
      - name: preference
        type: string
        required: false
        description: >-
          One of "fastest", "fewest_changes", "least_walking" or "step_free"
          if the user asked for that kind of route. Return an empty string if
          they did not.
      - name: buffer_minutes
        type: integer
        required: false
        description: >-
          Spare minutes the user wants before the arrival time, if they said.
          Leave this out entirely if not mentioned; never guess.
      - name: cold_below_c
        type: number
        required: false
        description: >-
          The temperature in Celsius below which the user counts it as cold, if
          they named one. Leave this out entirely if not mentioned; never guess.
    output:
      - name: task
        type: string
        description: Which journey question was answered.
      - name: headline
        type: string
        description: One short line, the whole answer. Final; use it as written.
      - name: key_points
        type: array
        item_type: string
        description: Up to 3 short phrases, most important first. Final.
      - name: source
        type: string
        description: Where the data comes from, in a word or two.
      - name: duration_minutes
        type: integer
        required: false
        description: How long the journey takes, in minutes.
      - name: leave_at
        type: string
        required: false
        description: When to set off, as HH:MM London time.
      - name: arrive_at
        type: string
        required: false
        description: When the journey arrives, as HH:MM London time.
      - name: umbrella_needed
        type: boolean
        required: false
        description: For an evening plan, whether rain or snow is likely on the way or there.
      - name: wear_more
        type: boolean
        required: false
        description: For an evening plan, whether it will feel colder than the threshold.
      - name: sunset_plan
        type: string
        required: false
        description: One short line on fitting in the sunset.
      - name: after_dark
        type: boolean
        required: false
        description: Whether arriving or heading home happens after sunset.
      - name: return_route
        type: array
        item_type: string
        required: false
        description: Up to 3 short lines for the way home.
      - name: crime_note
        type: string
        required: false
        description: One line of recorded crime at both ends; not a safety rating.
      - name: help_note
        type: string
        required: false
        description: One line of discreet ways to get help.

  # ── Live transport ───────────────────────────────────────────────────────
  - id: transport.live
    summary: Live Tube and rail line status and delays, next bus or train departures from a stop, free Santander bikes and docks, and whether a station is step-free with its lifts working
    example_phrases:
      - is the central line running
      - when is the next bus from
      - free bike docks near
      - is the lift working at
      - any tube delays right now
      - next departures at the station
      - are there santander bikes near
      - is the station step free
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          "status" for line status, delays or closures; "departures" for the
          next buses or trains from a stop or station; "bikes" for hire bikes
          or free docks; "step_free" for lifts, step-free access or station
          accessibility. Return an empty string if unsure.
      - name: place
        type: string
        required: false
        description: >-
          The station, bus stop or area the user named, as written. Return an
          empty string if the message does not name one; never assume the
          user's location.
      - name: line
        type: string
        required: false
        description: >-
          The Tube, Overground, Elizabeth line or DLR line named, such as
          "Central" or "Northern". Return an empty string if no line is named.
    output:
      - name: task
        type: string
        description: Which live question was answered.
      - name: headline
        type: string
        description: One short line, the whole answer. Final; use it as written.
      - name: key_points
        type: array
        item_type: string
        description: Up to 3 short phrases, most important first. Final.
      - name: source
        type: string
        description: Where the data comes from, in a word or two.
      - name: place
        type: string
        required: false
        description: The station, stop or area the answer is about.

  # ── Transportation fares ────────────────────────────────────────────────────────────────
  - id: transportation.fares
    summary: London transportation fares, the cheapest way to pay for the Tube, bus and trains, a single fare between two stations, or the fare to an airport
    example_phrases:
      - cheapest way to pay for the tube
      - how much is the tube fare from
      - cheapest train fare to heathrow airport
      - is a travelcard worth it for a week
      - what is the daily fare cap
      - how much does oyster cost for my stay
      - how much is a bus fare in london
      - should i buy a weekly travelcard or use contactless
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          Which transportation fares question this is. "best_ticket" for the cheapest way to pay
          over a stay or a week (caps, Travelcards, Oyster, contactless);
          "single_fare" for the price of one trip between two named stations;
          "airport" when an airport is named. Return an empty string if unsure.
      - name: from_place
        type: string
        required: false
        description: >-
          The station or place the trip starts from, as the user wrote it.
          Return an empty string if the message does not name one.
      - name: to_place
        type: string
        required: false
        description: >-
          The station or place the trip goes to, as the user wrote it. Return an
          empty string if the message does not name one.
      - name: airport
        type: string
        required: false
        description: >-
          The London airport named, as one of heathrow, gatwick, stansted, luton
          or city. Return an empty string if no airport is named.
      - name: zones
        type: string
        required: false
        description: >-
          The fare zones the user travels in, written like "1-2", "1-3", "1-4"
          or "1-6". Return an empty string if the message does not say.
      - name: stay_days
        type: integer
        required: false
        description: >-
          How many days the user will be travelling in London, if they said.
          Leave this out entirely if they did not; never guess.
      - name: rides_per_day
        type: number
        required: false
        description: >-
          How many journeys a day the user expects to make, if they said. Leave
          this out entirely if they did not; never guess.
      - name: days_per_week
        type: integer
        required: false
        description: >-
          How many days a week the user travels (1 to 7), if they said, such as
          5 for a commuter. Leave this out entirely if they did not.
      - name: bus_only
        type: boolean
        required: false
        description: >-
          True only if the user says they travel just on buses. Leave this out
          if they did not say.
      - name: card
        type: string
        required: false
        description: >-
          How the user pays: "uk_contactless", "foreign_contactless" (a card
          from outside the UK) or "none" (no contactless card). Return an empty
          string if the message does not say.
      - name: student
        type: boolean
        required: false
        description: >-
          True only if the user says they are a student living in London. Leave
          this out if they did not say.
      - name: peak
        type: boolean
        required: false
        description: >-
          True if the user travels at peak time (weekday 06:30-09:30 or
          16:00-19:00), false if off-peak. Leave this out if they did not say.
      - name: budget_gbp
        type: number
        required: false
        description: >-
          The most the user wants to spend on this trip, in pounds, if they said
          (for example 3 for "I have three pounds"). Leave this out entirely if
          not mentioned; never guess.
    output:
      - name: task
        type: string
        description: Which transportation fares question was answered.
      - name: headline
        type: string
        description: One short line, the whole answer. Final; use it as written.
      - name: key_points
        type: array
        item_type: string
        description: Up to 3 short phrases, most important first. Final.
      - name: source
        type: string
        description: Where the data comes from, in a word or two.
      - name: best_option
        type: string
        required: false
        description: The cheapest way to pay, in a few words.
      - name: cost_gbp
        type: number
        required: false
        description: The price in pounds of the answer in the headline.

  # ── Outdoors ─────────────────────────────────────────────────────────────
  - id: outdoors.walk
    summary: Whether it is a good time for a walk in London, whether to take an umbrella or extra layers when going out tonight, and rain, wind, air quality and sunset
    example_phrases:
      - is it a good time for a walk
      - do i need an umbrella tonight
      - will it rain in london
      - what should i wear to go out
      - how is the air quality in
      - will it rain when i go out tonight
      - what time is sunset in london
      - is it cold enough for a coat tonight
      - will it snow tonight
      - is it nice enough to walk in the park
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          "walk" if the user asks whether to go for a walk or be outside;
          "going_out" if they ask whether to take an umbrella, a coat or extra
          layers, or what to wear when going out; "weather" for rain,
          temperature, wind, air quality or sunset. Return an empty string if
          unsure.
      - name: place
        type: string
        required: false
        description: >-
          The London area, park or postcode named, as written. Return an empty
          string if the message does not name one.
      - name: minutes
        type: integer
        required: false
        description: >-
          How long the walk will be in minutes, if the user said. Leave this
          out entirely if they did not.
      - name: hours
        type: integer
        required: false
        description: >-
          How many hours ahead the user asks about (1 to 24), if they said.
          Leave this out entirely if they did not.
      - name: tonight
        type: boolean
        required: false
        description: >-
          True if the user says they are going out tonight or this evening.
          Leave this out if they did not say.
      - name: from_time
        type: string
        required: false
        description: >-
          When the user goes out, as 24-hour HH:MM London time, if they said.
          Return an empty string if they did not.
      - name: until_time
        type: string
        required: false
        description: >-
          When the user will be back, as 24-hour HH:MM London time, if they
          said. Return an empty string if they did not.
      - name: cold_below_c
        type: number
        required: false
        description: >-
          The temperature in Celsius below which the user counts it as cold, if
          they named one. Leave this out entirely if they did not; never guess.
      - name: day
        type: string
        required: false
        description: >-
          The day the user asks about, as they said it (tomorrow, saturday,
          2026-11-25). Return an empty string if they did not say.
    output:
      - name: task
        type: string
        description: Which outdoors question was answered.
      - name: headline
        type: string
        description: One short line, the whole answer. Final; use it as written.
      - name: key_points
        type: array
        item_type: string
        description: Up to 3 short phrases, most important first. Final.
      - name: source
        type: string
        description: Where the data comes from, in a word or two.
      - name: verdict
        type: string
        required: false
        description: For a walk, "go", "go with care" or "wait".
      - name: temperature_c
        type: number
        required: false
        description: The temperature now, in Celsius.
      - name: umbrella_needed
        type: boolean
        required: false
        description: For going out, whether rain or snow is likely while out.
      - name: wear_more
        type: boolean
        required: false
        description: For going out, whether it will feel colder than the threshold.

  # ── Safety ───────────────────────────────────────────────────────────────
  - id: safety.help
    summary: Discreet ways to get help in London, the local police neighbourhood team and the nearest station help point, or recorded crime counts for an area
    example_phrases:
      - i feel unsafe where can i get help
      - who is my local police team
      - how much crime is recorded near
      - where is the help point at the station
      - someone is following me
      - how do i contact the transport police
      - how do i make a silent 999 call
      - crime figures for
    inputs:
      - name: task
        type: string
        required: false
        description: >-
          "help" if the user wants help, feels unsafe or asks how to contact the
          police; "crime" if they ask about crime figures or statistics for an
          area. Return an empty string if unsure.
      - name: place
        type: string
        required: false
        description: >-
          The London station, postcode or area the user named, as written.
          Return an empty string if the message does not name one; never
          assume the user's location.
    output:
      - name: task
        type: string
        description: Which safety question was answered.
      - name: headline
        type: string
        description: One short line, the whole answer. Final; use it as written.
      - name: key_points
        type: array
        item_type: string
        description: Up to 3 short phrases, most important first. Final.
      - name: source
        type: string
        description: Where the data comes from, in a word or two.
      - name: data_month
        type: string
        required: false
        description: The month of crime data used, as YYYY-MM.
      - name: place
        type: string
        required: false
        description: The place the answer is about.
